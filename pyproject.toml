[project]
name = "vnexpress-mcp"
version = "0.1.0"
description = "MCP server: lấy tin mới nhất mục Thời sự của VnExpress"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
vnexpress-mcp = "vnexpress_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnexpress_mcp"]
